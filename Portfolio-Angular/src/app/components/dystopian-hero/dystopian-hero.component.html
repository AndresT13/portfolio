<section class="hero-scene" #scene [attr.aria-label]="i18n.t('hero.aria')">
  <div class="landscape day-layer" aria-hidden="true"></div>
  <div class="landscape night-layer" aria-hidden="true"></div>

  <div class="flock" aria-hidden="true">
    @for (bird of birds; track bird) {
      <div class="bird" [style.top.%]="14 + (bird * 5.3)" [style.left.px]="0">
        <svg viewBox="0 0 70 28" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <path class="wing" d="M35 16 Q17 -1 2 8 Q20 10 35 18" />
          <path class="wing" d="M35 16 Q53 -1 68 8 Q50 10 35 18" />
        </svg>
      </div>
    }
  </div>

  <div class="hero-shade" aria-hidden="true"></div>
  <div class="hero-copy">
    <span class="eyebrow">{{ i18n.t('hero.eyebrow') }}</span>
    <h1>{{ i18n.t('hero.title') }}<em>{{ i18n.t('hero.titleEm') }}</em></h1>
    <p>{{ i18n.t('hero.lead') }}</p>
    <div class="hero-actions">
      <a href="/proyectos" class="btn-primary">{{ i18n.t('hero.ctaProjects') }} <span aria-hidden="true">↗</span></a>
      <a href="https://www.linkedin.com/in/jaimeandrestellezg/" class="btn-outline" target="_blank" rel="noopener noreferrer">{{ i18n.t('hero.ctaTalk') }} <span aria-hidden="true">↗</span></a>
    </div>
  </div>

  <div class="scene-caption">{{ i18n.t('hero.caption') }}</div>
</section>
